apiVersion: apps/v1
kind: Deployment
metadata:
  name: expiration-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expiration
  template:
    metadata:
      labels:
        app: expiration
    spec:
      containers:
        - name: expiration
          image: salmantyagi/expiration
          env:
            - name: RABBITMQ_URL
              value: amqp://rabbitmq-srv:5672
            - name: REDIS_HOST
              value: expiration-redis-srv
